{% extends "base.html" %}
{% block title %}Change Password | UniFind{% endblock %}
{% block content %}
<section class="py-5 bg-light min-vh-100">
  <div class="container" style="max-width: 520px;">
    <div class="card shadow-sm border-0">
      <div class="card-body p-4 p-md-5">
        <h1 class="h3 fw-bold mb-4"><i class="bi bi-key me-2"></i>Change Password</h1>
        <form method="post" novalidate>
          {% csrf_token %}
          {% include "partials/form_field.html" %}
          <button type="submit" class="btn btn-primary w-100 fw-semibold">Update Password</button>
        </form>
      </div>
    </div>
  </div>
</section>
{% endblock %}
