{% extends "base.html" %}
{% block title %}Edit Profile | UniFind{% endblock %}
{% block content %}
<section class="py-5 bg-light min-vh-100">
  <div class="container" style="max-width: 640px;">
    <div class="card shadow-sm border-0">
      <div class="card-body p-4 p-md-5">
        <h1 class="h3 fw-bold mb-1"><i class="bi bi-person-gear me-2"></i>Edit Profile</h1>
        <p class="text-secondary small mb-4">Update your contact details (FR-03 Profile Management).</p>
        <form method="post" enctype="multipart/form-data" novalidate>
          {% csrf_token %}
          {% include "partials/form_field.html" %}
          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary fw-semibold px-4">Save Changes</button>
            <a href="{% url 'profile' %}" class="btn btn-outline-secondary">Cancel</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</section>
{% endblock %}
