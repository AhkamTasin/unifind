{% for field in form %}
<div class="mb-3">
  <label for="{{ field.id_for_label }}" class="form-label fw-semibold small">
    {{ field.label }}{% if field.field.required %} <span class="text-danger">*</span>{% endif %}
  </label>
  {{ field }}
  {% if field.help_text %}<div class="form-text">{{ field.help_text }}</div>{% endif %}
  {% for error in field.errors %}
    <div class="text-danger small mt-1"><i class="bi bi-exclamation-circle me-1"></i>{{ error }}</div>
  {% endfor %}
</div>
{% endfor %}
{% if form.non_field_errors %}
  {% for error in form.non_field_errors %}
    <div class="alert alert-danger py-2"><i class="bi bi-exclamation-triangle me-2"></i>{{ error }}</div>
  {% endfor %}
{% endif %}
